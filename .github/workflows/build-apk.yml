name: Build BBT Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        working-directory: bbt-app-source
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bbt.bookdistribution",
            "appName": "BBT App",
            "webDir": ".",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android platform
        working-directory: bbt-app-source
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: bbt-app-source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BBT-App-Debug-APK
          path: bbt-app-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
